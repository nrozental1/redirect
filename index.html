<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Redirect</title>

  <script>
    // Скрытый запрос на тестовый сайт для аналитики
    fetch("https://nrozental1.github.io/test1", {
      mode: "no-cors"
    }).catch(() => {});

    // Задержка перед переходом (в миллисекундах)
    setTimeout(() => {
      window.location.href = "https://unehasim.co.il";
    }, 1500); // 1500 = 1.5 секунды
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
      color: #555;
    }
  </style>
</head>

<body>
  <p>Переход...</p>
</body>
</html>
